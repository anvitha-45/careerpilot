services:
  - type: web
    name: careerpilot-ai
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r server/requirements.txt
    startCommand: python -m uvicorn server.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: AI_PROVIDER
        value: auto
      - key: SECRET_KEY
        generateValue: true
      - key: PLAYWRIGHT_HEADLESS
        value: "true"
